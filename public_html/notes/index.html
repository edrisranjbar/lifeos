<!doctype html>
<html lang="en">
  <head>
    <script src="/assets/storage.js?v=calendar-i18n-1"></script><script src="/assets/i18n.js?v=translation-2"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Connected Markdown notes on an infinite board with freehand drawing, images, mind maps and private previews."
    />
    <title>Notes · Edi Life OS</title>
    <script>
      (function () {
        try {
          var t = appStorage.getItem("edi_notes_theme");
          if (!t)
            t =
              appStorage.getItem("edi_os_theme") ||
              (window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark");
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="stylesheet" href="static/style.css?v=notes-mindmap-1" />
  <script src="/assets/html-escape.js?v=issue19-1"></script>
</head>
  <body>
    <header class="notes-toolbar">
      <div class="toolbar-left">
          <span class="count-pill" id="notesCount">0 notes</span>
      </div>
      <div class="toolbar-right">
        <button
          class="btn-ghost"
          id="drawBtn"
          type="button"
          aria-pressed="false"
          title="Draw on the board (D)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="M15 5l4 4"/></svg>
          <span>Draw</span>
        </button>
        <button
          class="btn-ghost"
          id="mapBtn"
          type="button"
          aria-pressed="false"
          title="Mind map (M)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.5"/><circle cx="18.5" cy="5.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/><path d="M7.5 11.1 16.2 6.7M7.5 12.9l8.7 4.4"/></svg>
          <span>Map</span>
        </button>
        <button
          class="btn-ghost"
          id="addImageBtn"
          type="button"
          title="Add an image to the board"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
          <span>Image</span>
        </button>
        <input type="file" id="imageInput" accept="image/*" multiple hidden />
        <label class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input
            class="search"
            id="searchInput"
            type="search"
            placeholder="Search notes"
            aria-label="Search notes"
          />
          <kbd>/</kbd>
        </label>
        <button
          class="btn-primary"
          id="newNoteBtn"
          title="Add a new sticky note (⌘N)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New note
        </button>
      </div>
    </header>

    <main class="canvas" id="canvas" aria-label="Sticky notes canvas">
      <div class="canvas-scene" id="canvasScene">
        <svg class="connections-layer" id="connectionsLayer" aria-label="Note connections"></svg>
        <svg class="mind-edges" id="mindEdges" aria-hidden="true"></svg>
        <svg class="drawings-layer" id="drawingsLayer" aria-hidden="true"></svg>
      </div>
      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-card">
          <span class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5Z"/><path d="M15 3v6h6"/></svg></span>
          <strong>Your canvas is empty</strong>
          <span>Capture a thought, a list or an idea. Notes support Markdown and can be linked together.</span>
          <button class="btn-primary" type="button" id="emptyNewNote">Create your first note</button>
        </div>
      </div>
    </main>

    <div class="draw-panel" id="drawPanel" hidden role="group" aria-label="Drawing tools">
      <div class="draw-inks" role="group" aria-label="Pen color">
        <button type="button" class="draw-ink" data-ink="ink" aria-pressed="true" title="Ink" aria-label="Ink"></button>
        <button type="button" class="draw-ink" data-ink="red" aria-pressed="false" title="Red" aria-label="Red"></button>
        <button type="button" class="draw-ink" data-ink="blue" aria-pressed="false" title="Blue" aria-label="Blue"></button>
        <button type="button" class="draw-ink" data-ink="amber" aria-pressed="false" title="Amber" aria-label="Amber"></button>
      </div>
      <div class="draw-widths" role="group" aria-label="Stroke thickness">
        <button type="button" class="draw-width" data-width="2" aria-pressed="false" title="Thin" aria-label="Thin"><span style="width:5px;height:5px"></span></button>
        <button type="button" class="draw-width" data-width="4" aria-pressed="true" title="Medium" aria-label="Medium"><span style="width:8px;height:8px"></span></button>
        <button type="button" class="draw-width" data-width="8" aria-pressed="false" title="Thick" aria-label="Thick"><span style="width:12px;height:12px"></span></button>
      </div>
      <div class="draw-actions">
        <button type="button" id="eraserBtn" aria-pressed="false" title="Eraser" aria-label="Eraser"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
        <button type="button" id="undoStroke" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button type="button" id="clearStrokes" title="Clear drawing" aria-label="Clear drawing"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
      </div>
      <span class="draw-hint">Esc to exit</span>
    </div>

    <div class="map-panel" id="mapPanel" hidden role="group" aria-label="Mind map tools">
      <div class="map-inks" role="group" aria-label="Branch color">
        <button type="button" class="map-ink" data-color="amber" aria-pressed="false" title="Amber" aria-label="Amber"></button>
        <button type="button" class="map-ink" data-color="blue" aria-pressed="false" title="Blue" aria-label="Blue"></button>
        <button type="button" class="map-ink" data-color="red" aria-pressed="false" title="Red" aria-label="Red"></button>
        <button type="button" class="map-ink" data-color="green" aria-pressed="false" title="Green" aria-label="Green"></button>
        <button type="button" class="map-ink" data-color="purple" aria-pressed="false" title="Purple" aria-label="Purple"></button>
      </div>
      <button type="button" class="map-action" id="mapArrange" title="Tidy the map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span>Arrange</span>
      </button>
      <button type="button" class="map-action" id="mapDelete" title="Delete node" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
        <span>Delete</span>
      </button>
      <span class="map-hint">Double-click to add · type to edit · Tab for a child · Enter for a sibling · Esc to exit</span>
    </div>

    <div class="canvas-controls" role="group" aria-label="Canvas zoom">
      <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
      <button type="button" id="resetZoom" title="Reset zoom">100%</button>
      <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
      <button type="button" id="fitNotes">Fit notes</button>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../assets/voice-input.js" defer></script>
    <script src="static/app.js?v=notes-mindmap-1" defer></script>
  </body>
</html>
