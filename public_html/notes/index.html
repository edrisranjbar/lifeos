<!doctype html>
<html lang="en">
<head>
  <script src="/assets/storage.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Markdown notes — quick notes stored locally in your browser.">
  <title>Notes · Edi Life OS</title>
  <script>
    (function () {
      try {
        var t = appStorage.getItem("edi_notes_theme");
        if (!t) t = appStorage.getItem("edi_os_theme") || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header class="notes-toolbar">
    <div class="toolbar-left">
      <h1>Notes</h1>
      <span class="small-note" id="notesCount">0 notes · Markdown</span>
    </div>
    <div class="toolbar-right">
      <input class="input search" id="searchInput" placeholder="Search…" aria-label="Search notes">
      <button class="btn-primary" id="newNoteBtn" title="Add a new sticky note (⌘N)">＋ New note</button>
    </div>
  </header>

  <main class="canvas" id="canvas" aria-label="Sticky notes canvas">
    <p class="empty-state" id="emptyState" hidden>No notes yet. Press ＋ to add a Markdown note.</p>
  </main>

  <div class="toast" id="toast"></div>
  <script src="static/app.js" defer></script>
</body>
</html>
