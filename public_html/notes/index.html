<!doctype html>
<html lang="en">
  <head>
    <script src="/assets/storage.js?v=calendar-i18n-1"></script><script src="/assets/i18n.js?v=persian-1"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Connected Markdown notes with per-note formatting and private previews."
    />
    <title>Notes · Edi Life OS</title>
    <script>
      (function () {
        try {
          var t = appStorage.getItem("edi_notes_theme");
          if (!t)
            t =
              appStorage.getItem("edi_os_theme") ||
              (window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark");
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="stylesheet" href="static/style.css?v=notes-canvas-2" />
  <script src="/assets/html-escape.js?v=issue19-1"></script>
</head>
  <body>
    <header class="notes-toolbar">
      <div class="toolbar-left">
          <span class="count-pill" id="notesCount">0 notes</span>
      </div>
      <div class="toolbar-right">
        <label class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input
            class="search"
            id="searchInput"
            type="search"
            placeholder="Search notes"
            aria-label="Search notes"
          />
          <kbd>/</kbd>
        </label>
        <button
          class="btn-primary"
          id="newNoteBtn"
          title="Add a new sticky note (⌘N)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New note
        </button>
      </div>
    </header>

    <main class="canvas" id="canvas" aria-label="Sticky notes canvas">
      <div class="canvas-scene" id="canvasScene">
        <svg class="connections-layer" id="connectionsLayer" aria-label="Note connections"></svg>
      </div>
      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-card">
          <span class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5Z"/><path d="M15 3v6h6"/></svg></span>
          <strong>Your canvas is empty</strong>
          <span>Capture a thought, a list or an idea. Notes support Markdown and can be linked together.</span>
          <button class="btn-primary" type="button" id="emptyNewNote">Create your first note</button>
        </div>
      </div>
    </main>

    <div class="canvas-controls" role="group" aria-label="Canvas zoom">
      <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
      <button type="button" id="resetZoom" title="Reset zoom">100%</button>
      <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
      <button type="button" id="fitNotes">Fit notes</button>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../assets/voice-input.js" defer></script>
    <script src="static/app.js?v=notes-canvas-2" defer></script>
  </body>
</html>
