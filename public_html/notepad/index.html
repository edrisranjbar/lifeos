<!doctype html>
<html lang="en">
<head>
  <script src="/assets/storage.js?v=csrf-1"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A focused Markdown notepad with live preview.">
  <title>Notepad · Edi Life OS</title>
  <script>
    try { document.documentElement.dataset.theme = appStorage.getItem('edi_os_theme') || 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="stylesheet" href="static/style.css?v=editor-2">
</head>
<body>
  <main class="app">
    <header class="page-header">
      <div class="header-actions">
        <span class="save-status" id="saveStatus" role="status">Saved</span>
        <div class="view-switch" role="group" aria-label="Notepad layout">
          <button type="button" data-view="write" aria-pressed="false">Write</button>
          <button type="button" data-view="split" aria-pressed="true">Split</button>
          <button type="button" data-view="preview" aria-pressed="false">Preview</button>
        </div>
      </div>
    </header>
    <section class="notepad-workspace">
      <aside class="notes-sidebar" aria-label="Saved notes">
        <div class="notes-sidebar-heading"><h2>Notes</h2><button type="button" class="new-note-btn" id="newNoteBtn" title="New note" aria-label="New note">＋</button></div>
        <label class="sort-label" for="noteSort">Sort notes</label>
        <select id="noteSort" class="note-sort">
          <option value="manual">Custom order</option>
          <option value="title">Name</option>
          <option value="recent">Recently edited</option>
        </select>
        <ol class="note-tabs" id="noteTabs" aria-label="Note tabs"></ol>
      </aside>
      <div class="note-work-area">
        <div class="note-title-row" hidden>
          <label class="sr-only" for="noteTitle">Note name</label>
          <input id="noteTitle" class="note-title-input" maxlength="100" placeholder="Name this note" autocomplete="off">
        </div>
        <section class="editor-shell" data-view="split" id="editorShell">
          <div class="pane write-pane"><div class="pane-label">Markdown</div><div class="md-toolbar" role="toolbar" aria-label="Format markdown"><button type="button" data-md="bold" title="Bold (Ctrl+B)" class="md-bold">B</button><button type="button" data-md="italic" title="Italic (Ctrl+I)" class="md-italic">I</button><button type="button" data-md="strike" title="Strikethrough" class="md-strike">S</button><button type="button" data-md="heading" title="Heading">H</button><button type="button" data-md="quote" title="Quote">❝</button><button type="button" data-md="ul" title="Bullet list">•</button><button type="button" data-md="ol" title="Numbered list">1.</button><button type="button" data-md="code" title="Inline code">`</button><button type="button" data-md="codeblock" title="Code block">{}</button><button type="button" data-md="link" title="Link">[]()</button></div><textarea id="notepadInput" spellcheck="true" aria-label="Markdown notepad" placeholder="# Start writing…"></textarea></div>
          <article class="pane preview-pane"><div class="pane-label">Preview</div><div class="markdown-preview" id="notepadPreview" dir="auto"></div></article>
        </section>
        <footer class="editor-status"><span id="writingStats">0 words · 0 characters</span><span id="cursorPosition">Ln 1, Col 1</span><button type="button" id="downloadNote" title="Download this note as Markdown">↓ Export .md</button></footer>
      </div>
    </section>
  </main>
  <script src="../assets/voice-input.js" defer></script>
  <script src="static/app.js?v=editor-2" defer></script>
</body>
</html>
