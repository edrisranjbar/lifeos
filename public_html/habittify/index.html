<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <script src="/assets/storage.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Habits · Monthly tracker</title>
    <script>
      (function () {
        try {
          var theme = appStorage.getItem("edi_os_theme");
          if (!theme)
            theme = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="icon" href="static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="static/style.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel stats-panel" aria-label="Month navigation">
        <header class="topbar">
          <div>
            <div class="eyebrow">Habit Tracker</div>
            <h1 id="monthName">—</h1>
            <p class="month-range" id="monthDateRange">—</p>
            <p class="consistency-rate" id="consistencyRate" aria-live="polite">Consistency —</p>
          </div>
          <div class="topbar-actions">
            <button class="ghost-btn today-button" id="todayBtn">Today</button>
            <div class="nav-buttons" aria-label="Month navigation">
              <button
                class="icon-btn"
                id="prevMonth"
                title="Previous month"
                aria-label="Previous month"
              >
                ‹
              </button>
              <button
                class="icon-btn"
                id="nextMonth"
                title="Next month"
                aria-label="Next month"
              >
                ›
              </button>
            </div>
          </div>
        </header>
      </section>

      <div class="progress-layout">
        <section class="panel calendar-panel" aria-labelledby="gridHeading">
          <div class="toolbar">
            <div>
              <div class="grid-kicker">Your progress</div>
              <h2 id="gridHeading">Monthly grid</h2>
              <p class="small-note">
                Select a day to mark a habit complete. Scroll sideways to see
                more dates.
              </p>
            </div>
            <div class="toolbar-actions">
              <span
                class="pill-label"
                id="monthCompletionPill"
                aria-live="polite"
                >0% complete</span
              >
              <button class="primary-btn" id="gridAddHabit" type="button">
                + Add habit
              </button>
            </div>
          </div>
          <div
            class="calendar-scroll"
            id="calendarScroll"
            role="region"
            aria-label="Monthly habit grid"
            tabindex="0"
          >
            <table class="habit-table" id="habitTable"></table>
          </div>
        </section>

        <section
          class="panel panel-pad activity-panel"
          aria-labelledby="activityHeading"
        >
          <div class="section-title">
            <div>
              <h3 id="activityHeading">Monthly activity</h3>
              <p class="small-note" id="activitySubtitle">Selected month</p>
            </div>
          </div>
          <div class="activity-grid" id="activityGrid"></div>
          <div
            class="activity-legend"
            aria-label="Activity intensity from less to more"
          >
            <span>Less</span>
            <span class="legend-swatch level-0"></span>
            <span class="legend-swatch level-1"></span>
            <span class="legend-swatch level-2"></span>
            <span class="legend-swatch level-3"></span>
            <span class="legend-swatch level-4"></span>
            <span>More</span>
          </div>
        </section>
      </div>

      <section class="workspace-grid" aria-label="Habit management and today">
        <section class="panel panel-pad habit-manager compact-card">
          <div class="section-title">
            <div>
              <h3>Habits</h3>
              <span class="small-note" id="habitCount">0 active</span>
            </div>
          </div>

          <form class="add-form" id="addForm">
            <input
              class="input"
              id="habitName"
              maxlength="80"
              placeholder="Habit name…"
              autocomplete="off"
              aria-label="Habit name"
              required
            />
            <select
              class="input"
              id="habitCategory"
              aria-label="Habit category"
            >
              <option value="">Uncategorized</option>
            </select>
            <button class="primary-btn" title="Add habit">Add</button>
          </form>

          <div class="habit-list" id="habitList"></div>
        </section>

        <div class="side-stack">
          <aside class="panel panel-pad focus-card compact-card">
            <div class="section-title">
              <div>
                <h3>Today</h3>
                <span class="small-note" id="todayDateLabel">—</span>
              </div>
            </div>
            <div class="today-list" id="todayList"></div>
          </aside>

          <aside class="panel panel-pad focus-card compact-card">
            <div class="section-title">
              <div>
                <h3>Categories</h3>
                <span class="small-note" id="categoryCount">0 categories</span>
              </div>
            </div>
            <form class="category-add-form" id="categoryAddForm">
              <input
                class="input"
                id="categoryName"
                maxlength="60"
                placeholder="New category…"
                autocomplete="off"
                aria-label="Category name"
                required
              />
              <button class="primary-btn" title="Add category">Add</button>
            </form>
            <div class="category-list" id="categoryList"></div>
          </aside>
        </div>
      </section>
    </main>

    <dialog class="edit-dialog" id="editDialog">
      <form class="edit-card" id="editForm" method="dialog">
        <div class="edit-head">
          <div>
            <h3>Edit habit</h3>
            <p>Update the habit name or category.</p>
          </div>
          <button type="button" class="icon-btn" id="closeEdit" title="Close">
            ×
          </button>
        </div>
        <input type="hidden" id="editHabitId" />
        <label>
          <span>Name</span>
          <input
            class="input"
            id="editHabitName"
            maxlength="80"
            autocomplete="off"
          />
        </label>
        <label>
          <span>Category</span>
          <select class="input" id="editHabitCategory">
            <option value="">Uncategorized</option>
          </select>
        </label>
        <div class="edit-actions">
          <button type="button" class="ghost-btn danger-text" id="deleteHabit">
            Remove
          </button>
          <button type="submit" class="primary-btn">Save changes</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast"></div>
    <script src="static/app.js" defer></script>
  </body>
</html>
