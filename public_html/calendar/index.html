<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar · Edi Life OS</title><script src="/assets/storage.js?v=currency-1"></script><script src="/assets/currency.js?v=currency-1"></script><link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="style.css?v=calendar-1"></head>
<body>
  <header class="calendar-toolbar">
    <div class="calendar-brand"><span class="calendar-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 11h18M8 15h2M14 15h2"/></svg></span><h1>Calendar</h1></div>
    <div class="calendar-navigation"><button id="todayBtn">Today</button><button class="icon-button" id="prevBtn" aria-label="Previous month">‹</button><button class="icon-button" id="nextBtn" aria-label="Next month">›</button><h2 id="monthTitle" aria-live="polite"></h2></div>
    <div class="calendar-tools"><label class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="searchInput" type="search" placeholder="Search tasks or dues" aria-label="Search dated tasks or financial dues"></label><select id="viewSelect" aria-label="Calendar view"><option value="month">Month</option><option value="schedule">Schedule</option></select><button class="icon-button" id="refreshBtn" aria-label="Refresh calendar">↻</button></div>
  </header>
  <main class="calendar-layout">
    <aside class="calendar-sidebar">
      <div class="mini-calendar"><h3 id="miniMonthTitle"></h3><div class="mini-weekdays" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div id="miniDays"></div></div>
      <section class="boards-section"><div class="sidebar-heading"><h3>Calendars</h3><button id="allBoardsBtn">Show all</button></div><div id="boardFilters"></div><label class="completed-filter"><input id="includeCompleted" type="checkbox" checked>Include completed</label></section>
      <button id="overdueBtn" class="overdue-summary"><span class="overdue-icon">!</span><span><strong id="overdueCount">0</strong><small>Overdue items</small></span><span>›</span></button>
      <section class="day-agenda"><div class="sidebar-heading"><h3 id="selectedDayTitle"></h3><span id="selectedDayCount"></span></div><div id="dayTasks"></div></section>
      <p class="calendar-note" id="calendarNote"></p><span class="calendar-timezone">Asia/Tehran · Kanban dates & financial dues</span>
    </aside>
    <section class="calendar-content" aria-label="Dated tasks and financial commitments">
      <div id="calendarStatus" role="status" aria-live="polite">Loading your board tasks…</div>
      <div id="monthView"><div class="month-weekdays" aria-hidden="true"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="monthGrid" class="month-grid"></div></div>
      <div id="scheduleView" class="schedule-view" hidden></div>
    </section>
  </main>
  <script type="module" src="app.js?v=currency-1"></script>
</body></html>
