<!doctype html>
<html lang="en">
  <head>
    <script src="/assets/storage.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kanban board with drag-and-drop cards, due dates, labels, and checklists."
    />
    <title>Kanban · Project Board</title>
    <script>
      (function () {
        try {
          var t = appStorage.getItem("edi_kanban_theme");
          if (!t)
            t = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="stylesheet" href="assets/styles/style.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <div class="app-container">
      <nav class="board-tabs" id="boardTabs" aria-label="Board navigation">
        <!-- Board tabs rendered by JS -->
      </nav>

      <main class="board-main" id="boardMain">
        <div class="columns-container" id="columnsContainer">
          <!-- Columns rendered by JS -->
        </div>
      </main>
    </div>

    <!-- Board Modal -->
    <dialog class="board-modal" id="boardModal">
      <form class="board-form" id="boardForm" method="dialog">
        <div class="modal-header">
          <h3 id="boardModalTitle">New Board</h3>
          <button
            type="button"
            class="icon-btn modal-close"
            id="closeBoardModal"
            title="Close"
          >
            ×
          </button>
        </div>
        <input type="hidden" id="boardId" />
        <label class="field">
          <span>Board Name</span>
          <input
            class="input"
            id="boardName"
            maxlength="60"
            placeholder="My Project…"
            autocomplete="off"
            required
          />
        </label>
        <div class="modal-actions">
          <button
            type="button"
            class="btn-ghost btn-danger"
            id="deleteBoardBtn"
            hidden
          >
            Delete Board
          </button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <!-- Card Detail / Edit Modal -->
    <dialog class="card-modal" id="cardModal">
      <form class="card-form" id="cardForm" method="dialog">
        <div class="modal-header">
          <h3 id="cardModalTitle">Card</h3>
          <button
            type="button"
            class="icon-btn modal-close"
            id="closeCardModal"
            title="Close"
          >
            ×
          </button>
        </div>
        <input type="hidden" id="cardBoardId" />
        <input type="hidden" id="cardColumnId" />
        <input type="hidden" id="cardId" />
        <label class="field">
          <span>Title</span>
          <input
            class="input"
            id="cardTitle"
            maxlength="120"
            placeholder="What needs doing?"
            required
          />
        </label>
        <label class="field">
          <span>Description</span>
          <textarea
            class="input textarea"
            id="cardDescription"
            rows="4"
            maxlength="2000"
            placeholder="Add details, links, acceptance criteria…"
          ></textarea>
        </label>
        <div class="card-form-row">
          <label class="field">
            <span>Priority</span>
            <select class="input" id="cardPriority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>
          <label class="field"><span>Due date</span><input class="input" id="cardDueDate" type="date" /></label>
        </div>
        <section class="card-detail-section" aria-labelledby="labelsHeading">
          <div class="detail-heading"><h4 id="labelsHeading">Labels</h4><span>Choose or manage board labels</span></div>
          <div id="cardLabelOptions" class="label-options"></div>
          <div class="label-editor">
            <input class="input" id="newLabelName" maxlength="30" placeholder="New label name" aria-label="New label name" />
            <input id="newLabelColor" type="color" value="#2563eb" aria-label="New label color" />
            <button class="btn-ghost" id="addLabelBtn" type="button">Add label</button>
          </div>
        </section>
        <section class="card-detail-section" aria-labelledby="checklistHeading">
          <div class="detail-heading"><h4 id="checklistHeading">Checklist</h4><span id="checklistProgress"></span></div>
          <div id="cardChecklist" class="checklist-items"></div>
          <div class="checklist-add"><input class="input" id="newChecklistItem" maxlength="120" placeholder="Add an item" aria-label="New checklist item" /><button class="btn-ghost" id="addChecklistItemBtn" type="button">Add</button></div>
        </section>
        <p class="card-form-error" id="cardFormError" role="alert" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn-ghost btn-danger" id="deleteCardBtn">
            Delete
          </button>
          <span class="card-form-meta" id="cardFormMeta"></span>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast"></div>
    <script src="assets/scripts/app.js" defer></script>
  </body>
</html>
